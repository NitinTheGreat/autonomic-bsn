# Phase 1 backend selection.
#
# The ONLY thing this phase needs from a backend is a real next-token
# log-probability distribution. Whichever backend passes check_logprobs.py is
# recorded in results/phase1/logprob_check.json and every later phase must use
# that same one.
#
# backend: vertex | llamacpp | vllm | gemini | ollama_native | auto
#   auto -> try each entry of `fallback_order` until one returns real logprobs.
backend: vertex

# Ollama is deliberately NOT in this chain (see ollama_native below).
# `gemini` is also excluded: the Developer API surface rejects logprobs on
# every model (verified live -- see README), so it can never satisfy gate 1.
fallback_order: [vertex, llamacpp, vllm]

backends:
  # ---------------------------------------------------------------- HOSTED --
  # Vertex AI (Google Cloud) -- the surface where Gemini logprobs are actually
  # available. Same generateContent body as the Developer API; different URL
  # and OAuth2 (bearer token) auth instead of an API key.
  #
  # Requires:
  #   - a GCP project with billing enabled and the Vertex AI API enabled
  #   - GOOGLE_CLOUD_PROJECT in .env
  #   - credentials: either GOOGLE_APPLICATION_CREDENTIALS pointing at a
  #     service-account JSON key with the "Vertex AI User" role, or
  #     `gcloud auth application-default login`
  #
  # NOTE: logprobs entitlement on Vertex has NOT been verified for this
  # account. check_logprobs.py exists precisely to answer that -- run it first
  # and believe its output, not this comment.
  vertex:
    endpoint: "https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/publishers/google/models/{model}:generateContent"
    model: "gemini-2.5-flash"
    style: vertex
    # Leave blank to read GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION from .env
    project: ""
    location: "us-central1"
    thinking_budget: 0

  # ----------------------------------------------------- NOT IN THE CHAIN --
  # Gemini DEVELOPER API (AI Studio key). VERIFIED NON-WORKING for this
  # project: on 2026-08-29 all 12 probed models -- gemini-2.5-flash,
  # gemini-2.5-pro, gemini-flash-latest, gemini-3-flash-preview,
  # gemini-3.5-flash, gemini-3.7-flash, gemma-4-31b-it and others -- returned
  #     400 "Logprobs is not enabled for this model"
  # while returning 200 for plain generation. The block is on this API surface,
  # not on a particular model, so changing `model` will NOT help.
  #
  # Use `vertex` above instead. This entry is kept so the finding is not
  # rediscovered the hard way, and in case the entitlement is ever enabled.
  gemini:
    endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    model: "gemini-2.5-flash"     # irrelevant: surface rejects logprobs
    style: gemini
    api_key_env: GEMINI_API_KEY
    # 2.5-series models spend output tokens on internal "thinking" by default,
    # which would eat our single allowed token. 0 disables it.
    thinking_budget: 0

  # ------------------------------------------------------- LOCAL FALLBACK --
  # llama.cpp server. CPU-only friendly, no GPU required.
  #   llama-server -m <path-to-gguf> -c 4096 --port 8080
  # Native /completion endpoint returns `completion_probabilities`, which is a
  # genuine pre-sampling logprob distribution when post_sampling_probs=false.
  llamacpp:
    endpoint: "http://localhost:8080/completion"
    model: "local-gguf"          # cosmetic label; llama.cpp serves one model
    style: llamacpp

  # ------------------------------------------------------- LOCAL FALLBACK --
  # vLLM. Its OpenAI-compatible /v1/completions DOES genuinely support logprobs
  # (unlike Ollama's /v1 compat layer -- see the note on ollama_native below).
  #   vllm serve <model> --port 8000
  vllm:
    endpoint: "http://localhost:8000/v1/completions"
    model: "meta-llama/Meta-Llama-3.1-8B-Instruct"   # must match `vllm serve`
    style: vllm
    echo: true                   # spec'd; harmless -- we read top_logprobs[-1]

  # ----------------------------------------------------- NOT IN THE CHAIN --
  # Kept for reference only; removed from fallback_order by request.
  # Ollama NATIVE /api/generate ONLY.
  #
  # NEVER point this at http://localhost:11434/v1/chat/completions. Ollama's
  # OpenAI-compatibility layer silently drops `logprobs` even when requested --
  # it is listed as unsupported in Ollama's own OpenAI-compat docs, and
  # ollama/ollama#16117 is the open request for it. It would return a 200 with a
  # plausible-looking body and no usable confidence data at all.
  #
  # The native endpoint only grew logprobs support in recent versions, so
  # _llm_client.py hard-verifies the field is present and fails loudly if not.
  ollama_native:
    endpoint: "http://localhost:11434/api/generate"
    model: "llama3.1:8b"
    style: ollama_native

request:
  timeout_s: 120
  temperature: 0.0
  # Step 1 uses 6 labels (A-F); the spec fixes n_probs at 6 there.
  step1_n_probs: 6
  # Step 2 uses 8 labels (A-H). We ask for more than 8 candidates on purpose:
  # with only 8 slots, probability mass parked on "\n", " " or "<eos>" can push
  # a real label token out of the top-k and silently zero it. 20 is cheap.
  step2_n_probs: 20
  # "Not uniform" test for step 1: max_prob must beat 1/6 by at least this much.
  uniform_margin: 0.05

data:
  # Resolved relative to the repo root, with fallbacks tried in order.
  pamap2_protocol_dirs:
    - "data/raw/pamap2/Protocol"
    - "../data/raw/pamap2/Protocol"

baseline:
  n_windows: 150
  window_seconds: 2.56
  overlap: 0.5
  sampling_rate_hz: 100
  min_window_coverage: 0.6     # keep a window only if >=60% of expected samples
  max_sample_gap_s: 0.1        # larger gap -> segment break (no straddling)
  few_shot_per_class: 2
  test_subjects: [101, 105, 106]      # >=3 subjects, per spec
  fewshot_subjects: [102, 103, 104, 107, 108]   # strictly disjoint from above
  pass_threshold: 0.65
  seed: 20260829
